<!DOCTYPE html>
<html lang="hr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PAR ERP Sustav - Obavijest o novoj lokaciji">
    <title>PAR ERP Sustav - Nova lokacija</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        par: { blue: '#1e3a8a', red: '#dc2626', gold: '#fbbf24', dark: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-200 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <main role="main" class="w-full max-w-md fade-in">
        <div class="bg-white dark:bg-slate-800 p-8 sm:p-10 rounded-3xl shadow-2xl text-center border border-slate-200 dark:border-slate-700 relative overflow-hidden">
            <!-- Gornja dekorativna linija u bojama PAR-a -->
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-par-blue via-par-red to-par-gold"></div>
            
            <!-- PAR Logo -->
            <div class="flex justify-center mb-6 mt-2" aria-hidden="true">
                <div class="text-5xl font-black tracking-tighter text-par-blue dark:text-white">PAR<span class="text-par-red">.</span></div>
            </div>
            
            <!-- Ikona -->
            <div class="w-16 h-16 bg-blue-50 dark:bg-slate-700/50 text-par-blue dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl shadow-inner">
                <i class="fa-solid fa-route"></i>
            </div>

            <!-- Obavijest (HR / EN) -->
            <h1 class="text-2xl font-bold mb-3 dark:text-white">Nova web adresa sustava</h1>
            <p class="text-slate-600 dark:text-slate-300 mb-2 text-sm leading-relaxed">
                Web adresa <strong>PAR ERP</strong> sustava preseljena je na novu lokaciju.
            </p>
            <p class="text-slate-400 dark:text-slate-500 mb-6 text-xs italic">
                The web address has moved to a new location:
            </p>
            
            <!-- Prikaz nove adrese -->
            <div class="bg-slate-50 dark:bg-slate-900/70 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 mb-8 break-all">
                <a href="https://par-education.github.io" class="text-par-blue dark:text-blue-400 font-bold hover:underline text-base sm:text-lg flex items-center justify-center gap-2">
                    <span>https://par-education.github.io</span>
                    <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                </a>
            </div>
            
            <!-- Gumb za preusmjeravanje -->
            <a href="https://par-education.github.io" class="inline-flex items-center justify-center w-full bg-par-blue hover:bg-blue-800 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg shadow-blue-900/20 active:scale-[0.98]">
                <span>Nastavi na novu lokaciju</span>
                <i class="fa-solid fa-arrow-right ml-2"></i>
            </a>
        </div>
    </main>

</body>
</html>
